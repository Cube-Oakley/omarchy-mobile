# OnePlus 13 (CPH2655): AW88461 amps on secondary MI2S (earpiece/top left,
# bottom right), WCD9395 analog microphones through the TX macro. PCM devices
# follow the board topology: 0 MultiMedia1 playback, 2 MultiMedia3 capture.
SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

# Main microphone (AMIC1, bias 1) on both capture channels: two decimators
# read the same SoundWire input, so simple apps get identical left and right.
SectionDevice."Mic" {
	Comment "Internal microphone"

	EnableSequence [
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 10"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX SMIC MUX1' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='TX_DEC1 Volume' 100"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
	]

	Value {
		CapturePriority 100
		CaptureChannels 2
		CapturePCM "hw:${CardId},2"
	}
}
