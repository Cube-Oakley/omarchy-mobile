Syntax 4

SectionUseCase."HiFi" {
	File "/OnePlus/OnePlus-13/HiFi.conf"
	Comment "Speakers and microphone"
}

# No speaker protection runs on the DSP here (stock runs Awinic's): keep the
# amps 6 dB under the stock profile's own level. The driver never goes above
# the profile, whatever this is set to.
BootSequence [
	cset "name='Top PCM Playback Volume' 959"
	cset "name='Bottom PCM Playback Volume' 959"
	cset "name='Top Profile Set' Music"
	cset "name='Bottom Profile Set' Music"
]
