# The AoC card's PCMs are not mmap-able the way ALSA expects: their mmap maps
# the AoC service ring itself (only the AAudio endpoints are meant for that),
# and the stock HAL opens these endpoints without mmap. 20 ms periods, as the
# HAL uses.
monitor.alsa.rules = [
  {
    matches = [
      { alsa.driver_name = "aoc-snd-card" }
      { api.alsa.pcm.card = "0", alsa.card_name = "google,aoc-snd-card" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-mmap = true
        api.alsa.period-size = 960
      }
    }
  }
]
