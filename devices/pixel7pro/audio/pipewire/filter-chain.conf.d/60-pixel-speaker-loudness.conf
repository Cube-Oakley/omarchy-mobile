# Louder built-in speakers (October 8): stock Android gets its loudness from
# the AoC's own processing, which this root does not run, so at full volume
# the speakers were quiet. A smart filter in front of the speaker sink only
# (Bluetooth and headphones are left alone): a 150 Hz high-pass (the
# speakers do not reproduce lower, and it takes headroom), then a lookahead
# limiter with 6 dB more gain and a ceiling of -1 dBFS. Average sound is
# louder; the peaks, and so the amplifiers' output, stay where they were.
# The amplifiers keep stock's gain (17.5 dB) and their protection firmware.
# Needs swh-plugins (fast_lookahead_limiter_1913); run with
# `pipewire -c filter-chain.conf`.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker loudness"
            media.name = "Speaker loudness"
            filter.graph = {
                nodes = [
                    { type = builtin name = highpass_l label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.707 } }
                    { type = builtin name = highpass_r label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.707 } }
                    {
                        type = ladspa
                        name = limiter
                        plugin = fast_lookahead_limiter_1913
                        label = fastLookaheadLimiter
                        control = { "Input gain (dB)" = 6.0 "Limit (dB)" = -1.0 "Release time (s)" = 0.1 }
                    }
                ]
                links = [
                    { output = "highpass_l:Out" input = "limiter:Input 1" }
                    { output = "highpass_r:Out" input = "limiter:Input 2" }
                ]
                inputs = [ "highpass_l:In" "highpass_r:In" ]
                outputs = [ "limiter:Output 1" "limiter:Output 2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "effect_input.pixel_speaker_loudness"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = "pixel-speaker-loudness"
                filter.smart.target = { node.name = "alsa_output.platform-sound-aoc.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name = "effect_output.pixel_speaker_loudness"
                node.passive = true
            }
        }
    }
]
