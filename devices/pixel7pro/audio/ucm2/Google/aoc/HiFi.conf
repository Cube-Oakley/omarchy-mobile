# AoC endpoints as the stock audio HAL uses them (audio_platform_configuration
# and mixer_paths): deep-buffer playback on EP6 (PCM 5) to TDM_0, the two
# CS35L41 amplifiers; recording on EP1 (PCM 8) from the built-in microphones.
# TDM_0 carries four 32-bit slots at 48 kHz: left (top earpiece) in slot 0,
# right (bottom speaker) in slot 1, the amplifiers' V/I sense coming back.
#
# The routes are set with the verb: an AoC front end with no route to a back
# end cannot be opened (ASoC DPCM returns EINVAL), and PipeWire probes the
# PCMs before it enables any device.

SectionVerb {
	EnableSequence [
		cset "name='TDM_0_RX Chan' Four"
		cset "name='TDM_0_RX Format' S32_LE"
		cset "name='TDM_0_RX Sample Rate' SR_48K"
		cset "name='TDM_0_TX Chan' Four"
		cset "name='TDM_0_TX Format' S32_LE"
		cset "name='TDM_0_TX Sample Rate' SR_48K"
		cset "name='TDM_0_RX Mixer EP6' 1"
		cset "name='BUILDIN MIC ID CAPTURE LIST' 0,3,2,-1"
		cset "name='MIC DC Blocker' 1"
		cset "name='MIC Record Soft Gain (dB)' 22"
		cset "name='EP1 TX Mixer INTERNAL_MIC_TX' 1"
	]
	DisableSequence [
		cset "name='TDM_0_RX Mixer EP6' 0"
		cset "name='EP1 TX Mixer INTERNAL_MIC_TX' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},5"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Microphones"
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},8"
		CaptureChannels 2
	}
}
