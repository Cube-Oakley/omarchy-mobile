<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- pixel-sensor-proxy's sleep pause (org.omarchy.Mobile.SensorPower):
     only root (pixel-suspend, pixel-display-hook) may call it. And step
     counting. -->
<busconfig>
  <policy user="root">
    <allow send_destination="net.hadess.SensorProxy" send_interface="org.omarchy.Mobile.SensorPower"/>
  </policy>
  <!-- Step counting (org.omarchy.Mobile.Steps): anyone may ask; the proxy
       lets only root and the session user switch it. -->
  <policy context="default">
    <allow send_destination="net.hadess.SensorProxy" send_interface="org.omarchy.Mobile.Steps"/>
  </policy>
</busconfig>
