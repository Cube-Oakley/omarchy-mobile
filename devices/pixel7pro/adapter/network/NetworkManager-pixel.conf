# The USB gadget link to the development host is configured by the boot script.
# /etc/resolv.conf links to systemd-resolved's file, and systemd does not run
# here: NetworkManager writes the link's target itself.
[main]
dns=default
rc-manager=file

[keyfile]
unmanaged-devices=interface-name:usb0

# The Wi-Fi chip's OTP holds no MAC address, so brcmfmac picks a random one on
# every boot and the router sees a new device each time. Use an address derived
# per network from NetworkManager's own secret key instead: stable across
# reboots, different between networks, and nothing from the hardware.
[connection]
wifi.cloned-mac-address=stable
